<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlockChain</title>
<style>
:root{--bg:#f4f4f5;--sf:#fff;--tx:#141416;--mu:#6b6b73;--bd:#e2e2e5;--rd:#c8102e;--rd2:#8a0b20;--ng:#d92d3f;--sh:0 1px 2px rgba(0,0,0,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0d;--sf:#161618;--tx:#f2f2f3;--mu:#8e8e96;--bd:#2a2a2e;--rd:#e5203d;--rd2:#c8102e;--ng:#ff6b78;--sh:none}}
:root[data-theme="dark"]{--bg:#0c0c0d;--sf:#161618;--tx:#f2f2f3;--mu:#8e8e96;--bd:#2a2a2e;--rd:#e5203d;--rd2:#c8102e;--ng:#ff6b78;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rd);outline-offset:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:var(--sh)}
.btn{background:var(--rd);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;transition:background .15s}
.btn:hover{background:var(--rd2)}.btn:disabled{opacity:.6;cursor:wait}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.g:hover{background:var(--bd)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.sim{display:inline-block;font-size:11px;color:var(--mu);background:var(--bd);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle}
.up{color:#16a34a;margin-top:4px;font-weight:600}.alloc{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;margin:18px 0 10px}.alloc i{display:block;min-width:3px}.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mu)}.lg b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a34a;margin-right:8px}
.ld{display:grid;place-items:center;min-height:50vh}.ld i{width:44px;height:44px;border:4px solid var(--bd);border-top-color:var(--rd);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}
.b-Pending{color:#b7791f;border-color:#b7791f}.b-Completed{color:#16a34a;border-color:#16a34a}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,rgba(200,16,46,.18),transparent 45%),var(--bg)}
#login .card{width:100%;max-width:400px;padding:28px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}.logo b{color:var(--rd)}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:var(--sf);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:4px;z-index:20}
aside a{padding:9px 12px;border-radius:8px;color:var(--mu);text-decoration:none;cursor:pointer}
aside a:hover{background:var(--bd)}aside a.on{background:var(--rd);color:#fff}
main{margin-left:230px;padding:22px;max-width:1200px}
.top{display:none;position:sticky;top:0;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px;align-items:center;justify-content:space-between;z-index:15}
.grid{display:grid;gap:14px;grid-template-columns:repeat(4,1fr);margin:16px 0}
.g2{display:grid;gap:14px;grid-template-columns:2fr 1fr}
.k{color:var(--mu);font-size:13px}.gh{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:14px}.v{font-size:26px;font-weight:700;letter-spacing:-.02em}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:16px;margin:0 0 10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px;cursor:pointer}tr.r:hover{background:var(--bd);cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.bar>*{width:auto;flex:1 1 140px}
.tabs{display:flex;gap:4px}.tabs button{padding:4px 10px;border:1px solid var(--bd);background:none;border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--rd);border-color:var(--rd);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{max-width:480px;width:100%;max-height:90vh;overflow:auto}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd);word-break:break-all}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60}
.sk{height:120px;border-radius:10px;background:linear-gradient(90deg,var(--bd),var(--sf),var(--bd));background-size:200%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200%}}
.err{color:var(--ng);font-size:13px;min-height:18px}
.empty{text-align:center;color:var(--mu);padding:30px}
@media(max-width:820px){aside{transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}main{margin:0;padding:14px}.top{display:flex}.grid{grid-template-columns:1fr 1fr}.g2,.gh{grid-template-columns:1fr}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.hr{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bd)}.hr:last-child{border:0}
.ic{width:38px;height:38px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
#bn{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
#bn a{flex:1;text-align:center;font-size:11px;color:var(--mu);text-decoration:none;padding:4px 0}#bn a i{display:block;font-style:normal;font-size:18px}#bn a.on{color:var(--rd);font-weight:600}
@media(max-width:820px){#bn{display:flex}main{padding-bottom:84px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{background:linear-gradient(135deg,#c8102e,#4a0412);color:#fff;border:0}
.hero .k{color:rgba(255,255,255,.75)}.hero .up{color:#bbf7d0}.hero .dn{color:#fecaca;margin-top:4px;font-weight:600}
.hero .lg{color:rgba(255,255,255,.8)}
.act{display:flex;gap:10px;margin-top:16px}.act .btn{flex:1;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}.act .btn:hover{background:rgba(255,255,255,.3)}
aside a.on{box-shadow:0 2px 10px rgba(200,16,46,.35)}
main>*{animation:fi .25s ease-out}@keyframes fi{from{opacity:0}}
.modal .card{animation:fi .15s ease-out}
@media(max-width:820px){input,select{font-size:16px;min-height:44px}.btn{min-height:44px}.modal{place-items:end center;padding:0}.modal .card{max-width:none;border-radius:18px 18px 0 0}.v{font-size:22px}}
@media(max-width:600px){.tw:has(#tb) table{min-width:0}#th th:nth-child(3),#th th:nth-child(7),#th th:nth-child(8),#tb td:nth-child(3),#tb td:nth-child(7),#tb td:nth-child(8){display:none}}
.demo{background:var(--sf);border-top:1px solid var(--bd);color:var(--mu);font-size:13px;text-align:center;padding:10px 14px}
#login .demo{position:fixed;left:0;right:0;bottom:0}
#app .demo{margin-left:230px}
@media(max-width:820px){#app .demo{margin:0 0 calc(64px + env(safe-area-inset-bottom,0px))}}
.verify{position:relative;margin:16px 0;padding:14px;border:1px solid color-mix(in srgb,var(--rd) 42%,var(--bd));border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--rd) 9%,var(--bg)),var(--bg) 62%);box-shadow:0 8px 22px rgba(0,0,0,.08);overflow:hidden}.verify:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--rd),#ff8d76)}.verify-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}.verify-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}.verify-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--rd);color:#fff;font-size:13px}.verify-badge{margin-left:auto;padding:3px 7px;border:1px solid color-mix(in srgb,var(--rd) 35%,var(--bd));border-radius:999px;color:var(--rd);font-size:10px;font-weight:800;letter-spacing:.6px}.verify-refresh{border:1px solid var(--bd);border-radius:7px;background:var(--card);color:var(--rd);font:inherit;font-size:17px;cursor:pointer;line-height:1;padding:4px 7px}.verify-refresh:disabled{opacity:.65;cursor:wait}.verify.loading .verify-mark{animation:vp .65s ease-in-out infinite alternate}.verify.loading .verify-refresh{animation:vs .65s linear infinite}@keyframes vs{to{transform:rotate(360deg)}}@keyframes vp{to{transform:scale(.83);opacity:.55}}.verify label{margin:0 0 7px;font-size:13px;font-weight:700}.verify input{margin:0;background:var(--card)}.verify .k{margin-top:7px;font-size:12px}</style>
</head>
<body>
<section id="login">
<form class="card" id="lf" novalidate>
<div class="logo">Block<b>Chain</b></div>
<p class="k" style="margin-top:14px">Sign in to access your account.</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label>
<div style="display:flex;gap:6px"><input id="pw" type="password" autocomplete="current-password"><button type="button" class="btn g" id="tp" aria-label="Show password">Show</button></div>
<div style="display:flex;justify-content:space-between;margin:12px 0"><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto"> Remember me</label><a href="#" id="fp" style="color:var(--rd)">Forgot password?</a></div>
<div class="verify" id="lv"><div class="verify-head"><div class="verify-title"><span class="verify-mark">✓</span><span>Security verification</span></div><span class="verify-badge">PROTECTED</span><button type="button" class="verify-refresh" id="vr">↻</button></div><label for="vc" id="vq">Solve the security check</label><input id="vc" type="number" inputmode="numeric" placeholder="Enter answer"><div class="k">A quick check helps protect your account.</div></div><div class="err" id="le" role="alert"></div><button class="btn" id="lb" style="width:100%">Sign in</button>
</form>

</section>

<div id="app">
<div class="top"><button class="btn g" id="hb" aria-label="Menu">☰</button><span class="logo">Block<b>Chain</b></span><button class="btn g" id="t2" aria-label="Toggle theme">◐</button></div>
<aside id="sb">
<div class="logo" style="padding:6px 12px 16px">Block<b>Chain</b></div>
<div id="nav"></div>
<div style="margin-top:auto;padding:10px 12px;word-break:break-all" class="k" id="who"></div>
<button class="btn g" id="t1">Switch theme</button>
<button class="btn g" id="lo">Log out</button>
</aside>
<main id="mn"></main>

<nav id="bn" aria-label="Primary"></nav>
</div>

<script>
"use strict";
/* ---------- data layer ---------- */
const $=s=>document.querySelector(s);
const usd=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const tok=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hex=(seed,n)=>{let x=seed*9301+49297,o="";while(o.length<n){x=(x*9301+49297)%233280;o+=(x%16).toString(16)}return o};
const ST=["Completed","Pending"],TY=["Transfer","Swap","Stake","Receive"],AS=["BTC","ETH","USDT","SOL"],NW=["Mainnet","Layer 2"];
const TXS=Array.from({length:24},(_,i)=>{const id=10024-i;return{id:"TX-"+id,date:new Date(2026,8,29-i*3).toISOString().slice(0,10),type:TY[i%4],asset:AS[i%4],amount:Math.round((500+((i*7919)%9000))*100)/100*(i%4===3?1:-1)*(i%3?1:-1),status:i%3===1?"Pending":"Completed",network:NW[i%2],ref:"REF-"+hex(i+3,6).toUpperCase(),hash:"0x"+hex(id,56),block:4820000+id,from:"bc1"+hex(id+1,30),to:"bc1"+hex(id+2,30),gas:(0.0004+i*0.00003).toFixed(5)+" GAS",conf:i%3===1?0:12+i}});
const USERS=[["U-001","Robert Snyder","bsbs69760@gmail.com","Active",140400]].map(([id,name,email,status,bal])=>({id,name,email,status,bal,created:"2026-02-10"}));
const HOLD=[{n:"Bitcoin",s:"BTC",q:"1.82000000 BTC",v:98280,p:54000,c:2.45,col:"#f7931a"},{n:"Ethereum",s:"ETH",q:"12.93019331 ETH",v:24240.52,p:1874.77,c:1.92,col:"#627eea"},{n:"Solana",s:"SOL",q:"33.33333333 SOL",v:5000,p:150,c:-0.84,col:"#9945ff"},{n:"Tether",s:"USDT",q:"9,500.00 USDT",v:9500,p:1,c:0.01,col:"#26a17b"}];
const CASH=3379.48,LATEST=4830024;
const services={
 series(days){const pts=days>=365?52:days>=90?45:Math.min(days,30);let b=100400;return Array.from({length:pts},(_,i)=>{b+=Math.sin(i*1.3+days)*900+(40400/pts)*(days>=90?0.9:0.6);return Math.round(b)})},
 txs:()=>TXS,
 explorer(q){q=q.trim().toLowerCase();return TXS.find(t=>t.id.toLowerCase()===q||t.hash.toLowerCase()===q||String(t.block)===q||t.from===q||t.to===q)||null},
 users:()=>USERS
};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- theme ---------- */
const applyTheme=t=>document.documentElement.setAttribute("data-theme",t);
const cur=()=>store.get("bv-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
applyTheme(cur());
const flip=()=>{const t=cur()==="dark"?"light":"dark";store.set("bv-theme",t);applyTheme(t)};
$("#t1").onclick=$("#t2").onclick=flip;

/* ---------- toast + confirm ---------- */
function toast(m){const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2600)}
function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML='<div class="card" role="dialog" aria-modal="true">'+html+'<p style="text-align:right"><button class="btn g" data-x>Close</button></p></div>';m.onclick=e=>{if(e.target===m||e.target.dataset.x!==undefined)m.remove()};document.body.append(m);return m}
function confirmBox(msg,ok){const m=modal("<h2>Confirm</h2><p>"+esc(msg)+'</p><button class="btn" data-ok>Confirm</button>');m.querySelector("[data-ok]").onclick=()=>{m.remove();ok()}}

/* ---------- auth (mock only; a real build needs server sessions + hashed passwords) ---------- */
let authed=store.get("bv-auth")==="1";
$("#tp").onclick=()=>{const p=$("#pw"),s=p.type==="password";p.type=s?"text":"password";$("#tp").textContent=s?"Hide":"Show"};
$("#fp").onclick=e=>{e.preventDefault();toast("Password reset is unavailable in the prototype")};
const PROFILE={name:"Robert Snyder",email:"bsbs69760@gmail.com"};
const CRED="33e9c1ff939c691652de774f17aeb0fca4d80ccd6c8b395696ad7df0817826f4";
async function check(em,pw){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("bc-demo:"+em.toLowerCase()+":"+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")===CRED}catch(e){return false}}
let va=0;function nv(){const a=2+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*8);va=a+b;$("#vq").textContent=`Solve: ${a} + ${b} =`;$("#vc").value=""}function rv(box,btn,fn){box.classList.add("loading");btn.disabled=true;setTimeout(()=>{fn();btn.disabled=false;box.classList.remove("loading")},550)}$("#vr").onclick=()=>rv($("#lv"),$("#vr"),nv);nv();
$("#lf").onsubmit=e=>{e.preventDefault();const em=$("#em").value.trim(),pw=$("#pw").value,er=$("#le");er.textContent="";
 if(!/^\S+@\S+\.\S+$/.test(em))return er.textContent="Enter a valid email address.";
 if(pw.length<8)return er.textContent="Password must be at least 8 characters.";
 if(Number($("#vc").value)!==va){nv();return er.textContent="Please complete the security verification.";}
 $("#lb").disabled=true;$("#lb").textContent="Signing in…";
 setTimeout(async()=>{const ok=await check(em,pw);$("#lb").disabled=false;$("#lb").textContent="Sign in";
  if(ok){authed=true;store.set("bv-auth","1");boot()}else er.textContent="Email or password is incorrect."},0)};
$("#lo").onclick=()=>confirmBox("Log out of the prototype?",()=>{authed=false;store.set("bv-auth","0");location.hash="";boot()});

/* ---------- routing ---------- */
const PAGES=[["dashboard","Home"],["prices","Prices"],["assets","Assets"],["transactions","Transactions"],["activity","Activity"],["explorer","Explorer"],["account","Account"],["settings","Settings"]];
const BN=[["dashboard","Home","⌂"],["prices","Prices","▮"],["assets","Assets","◈"],["transactions","Transactions","⇄"],["activity","Activity","◷"]];
function boot(){$("#login").style.display=authed?"none":"grid";$("#app").style.display=authed?"block":"none";if(authed){$("#who").innerHTML=esc(PROFILE.name)+"<br>"+esc(PROFILE.email);route()}}
function route(){const p=(location.hash.slice(2)||"dashboard");const pg=PAGES.find(x=>x[0]===p);
 $("#nav").innerHTML=PAGES.map(([k,n])=>`<a href="#/${k}" class="${k===p?"on":""}" style="display:block">${n}</a>`).join("");
 $("#bn").innerHTML=BN.map(([k,n,g])=>`<a href="#/${k}" class="${k===p?"on":""}"><i>${g}</i>${n}</a>`).join("");$("#sb").classList.remove("open");const mn=$("#mn");
 if(!pg){mn.innerHTML='<div class="empty"><h1>404</h1><p>That page does not exist.</p><a href="#/dashboard" class="btn" style="text-decoration:none">Back to dashboard</a></div>';return}
 mn.innerHTML='<div class="ld" role="status" aria-label="Loading"><i></i></div>';setTimeout(()=>{try{R[p](mn)}catch(e){mn.innerHTML='<div class="empty"><h1>Something went wrong</h1><p>Reload the page and try again.</p></div>'}},250);document.title=pg[1]+" · BlockChain"}
addEventListener("hashchange",()=>authed&&route());
$("#hb").onclick=()=>$("#sb").classList.toggle("open");

const head=(t,s)=>`<h1>${t}</h1><p class="k">${s}</p>`;
function chart(vals){if(!vals.length)return '<div class="empty">No balance history yet.</div>';const w=600,h=200,mx=Math.max(...vals),mn=Math.min(...vals),sx=w/(vals.length-1||1);const y=v=>h-10-((v-mn)/(mx-mn||1))*(h-30);
 const d=vals.map((v,i)=>(i?"L":"M")+(i*sx).toFixed(1)+" "+y(v).toFixed(1)).join("");
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Wallet balance history chart"><path d="${d}L${w} ${h}L0 ${h}Z" fill="var(--rd)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--rd)" stroke-width="2.5"/>${vals.map((v,i)=>`<circle cx="${i*sx}" cy="${y(v)}" r="6" fill="transparent"><title>${usd(v)}</title></circle>`).join("")}</svg><div class="k" style="display:flex;justify-content:space-between"><span>Low ${usd(mn)}</span><span>High ${usd(mx)}</span></div>`}

/* ---------- pages ---------- */
const amt=t=>(t.amount<0?"-":"+")+Math.abs(t.amount).toLocaleString("en-US",{minimumFractionDigits:2})+" "+t.asset;
const netStats=()=>{const p=TXS.filter(t=>t.status==="Pending").length;return `<div class="grid">${[["Network status",'<span class="dot"></span>Operational'],["Latest block",LATEST.toLocaleString("en-US")],["Avg. gas fee","0.00042 GAS"],["Pending transactions",p]].map(([a,b])=>`<div class="card"><div class="k">${a}</div><div class="v" style="font-size:20px">${b}</div></div>`).join("")}</div>`};
const latest=()=>`<div class="gh"><div class="card"><h2>Latest blocks</h2>${[0,1,2,3,4].map(i=>`<div class="row"><span class="mono">#${(LATEST-i).toLocaleString("en-US")}</span><span class="k">${118+i*9} txs · ${62+i*4}% gas used</span></div>`).join("")}</div><div class="card"><h2>Latest transactions</h2>${TXS.slice(0,5).map(t=>`<div class="row" data-tx="${esc(t.id)}" style="cursor:pointer"><span class="mono">${esc(t.hash.slice(0,10))}…${esc(t.hash.slice(-6))}</span><span class="k">${amt(t)}</span></div>`).join("")}</div></div>`;
const chg=a=>`<span style="color:${a.c>=0?"#16a34a":"var(--ng)"}">${a.c>=0?"▲":"▼"} ${Math.abs(a.c).toFixed(2)}%</span>`;
const spark=(i,col,up)=>{let d="";for(let k=0;k<24;k++){const y=14-Math.sin(k*.6+i*2)*5-(up?k*.25:-k*.25)+Math.cos(k*1.7+i)*2;d+=(k?"L":"M")+(k*3.6).toFixed(1)+" "+y.toFixed(1)}return `<svg width="84" height="28" viewBox="0 0 84 28" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/></svg>`};
const holdRows=()=>`<div class="card" style="padding:0"><div class="hr"><div class="ic" style="background:#16a34a">$</div><div style="flex:1"><b>US Dollars</b><div class="k">${usd(CASH)}</div></div></div>${HOLD.map((a,i)=>`<div class="hr"><div class="ic" style="background:${a.col}">${a.s[0]}</div><div style="flex:1;min-width:0"><b>${a.n}</b><div>${usd(a.v)}</div><div class="k">${a.q}</div></div><div style="text-align:right">${spark(i,a.col,a.c>=0)}<div><b>${usd(a.p)}</b></div><div>${chg(a)}</div></div></div>`).join("")}</div>`;
const R={
dashboard(mn){
 const sr=services.series(30),dv=sr[sr.length-1]-sr[0],tot=CASH+HOLD.reduce((a,h)=>a+h.v,0),parts=[{n:"US Dollars",v:CASH,col:"#16a34a"},...HOLD.map(h=>({n:h.n,v:h.v,col:h.col}))];
 const alloc=`<div class="alloc">${parts.map(p=>`<i style="width:${p.v/tot*100}%;background:${p.col}" title="${p.n}"></i>`).join("")}</div><div class="lg">${parts.map(p=>`<span><b style="background:${p.col}"></b>${p.n} ${(p.v/tot*100).toFixed(1)}%</span>`).join("")}</div>`;
 mn.innerHTML=`<h1>Overview</h1><p class="k">Portfolio summary</p>
 <div class="card hero" style="margin-top:14px"><div class="k">Total balance</div><div class="v" style="font-size:40px">${usd(tot)}</div><div class="${dv>=0?"up":"dn"}">${dv>=0?"▲":"▼"} ${usd(Math.abs(dv))} (${(dv/sr[0]*100).toFixed(2)}%) <span class="k" style="font-weight:400">past 30 days</span></div><div class="act"><button class="btn" id="snd">Send</button><button class="btn" id="rcv">Receive</button></div>${alloc}</div>
 <div class="g2" style="margin-top:14px"><div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h2>Wallet balance history</h2><div class="tabs" id="rg"></div></div><div id="ch"></div></div><div><h2 style="margin:2px 0 8px">Holdings</h2>${holdRows()}</div></div>${netStats()}${latest()}`;
 const set=d=>{$("#ch").innerHTML=chart(services.series(d));$("#rg").innerHTML=[["7D",7],["30D",30],["90D",90],["1Y",365]].map(([l,v])=>`<button class="${v===d?"on":""}" data-d="${v}">${l}</button>`).join("");$("#rg").querySelectorAll("button").forEach(b=>b.onclick=()=>set(+b.dataset.d))};set(30);
 mn.querySelectorAll("[data-tx]").forEach(r=>r.onclick=()=>detail(TXS.find(t=>t.id===r.dataset.tx)))
 $("#snd").onclick=sendBox;$("#rcv").onclick=recvBox},

transactions(mn){
 let q="",f="",sk="date",dir=-1,pg=0;const PS=8;
 mn.innerHTML=head("Transactions","Your transaction history.")+`<div class="card"><div class="bar"><input id="q" placeholder="Search ID, asset, reference" aria-label="Search"><select id="f" aria-label="Status filter"><option value="">All statuses</option>${ST.map(s=>`<option>${s}</option>`).join("")}</select><button class="btn g" id="ex">Export CSV</button></div><div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div><div id="em"></div><div class="bar" id="pgn" style="justify-content:space-between"></div></div>`;
 const cols=[["id","Transaction ID"],["date","Date"],["type","Type"],["asset","Asset"],["amount","Amount"],["status","Status"],["network","Network"],["ref","Reference"]];
 const draw=()=>{let d=services.txs().filter(t=>(!f||t.status===f)&&(!q||(t.id+t.asset+t.ref+t.type).toLowerCase().includes(q)));
  d.sort((a,b)=>(a[sk]>b[sk]?1:-1)*dir);const pages=Math.max(1,Math.ceil(d.length/PS));pg=Math.min(pg,pages-1);
  $("#th").innerHTML="<tr>"+cols.map(([k,n])=>`<th data-k="${k}">${n}${sk===k?(dir>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
  $("#th").querySelectorAll("th").forEach(h=>h.onclick=()=>{dir=sk===h.dataset.k?-dir:1;sk=h.dataset.k;draw()});
  $("#tb").innerHTML=d.slice(pg*PS,pg*PS+PS).map(t=>`<tr class="r" tabindex="0" data-id="${esc(t.id)}"><td class="mono">${esc(t.id)}</td><td>${t.date}</td><td>${t.type}</td><td>${t.asset}</td><td>${amt(t)}</td><td><span class="badge b-${t.status.split(" ")[0]}">${t.status}</span></td><td>${t.network}</td><td class="mono">${esc(t.ref)}</td></tr>`).join("");
  $("#em").innerHTML=d.length?"":'<div class="empty">'+(TXS.length?"No transactions match. Clear the search or filter.":"No transactions yet.")+'</div>';
  $("#pgn").innerHTML=`<span class="k">${d.length} results</span><span><button class="btn g" id="pv" ${pg?"":"disabled"}>Prev</button> <span class="k">${pg+1}/${pages}</span> <button class="btn g" id="nx" ${pg<pages-1?"":"disabled"}>Next</button></span>`;
  $("#pv").onclick=()=>{pg--;draw()};$("#nx").onclick=()=>{pg++;draw()};
  $("#tb").querySelectorAll("tr").forEach(r=>{const o=()=>detail(TXS.find(t=>t.id===r.dataset.id));r.onclick=o;r.onkeydown=e=>e.key==="Enter"&&o()})};
 $("#ex").onclick=exportCsv;$("#q").oninput=e=>{q=e.target.value.toLowerCase();pg=0;draw()};$("#f").onchange=e=>{f=e.target.value;pg=0;draw()};draw()},

explorer(mn){
 mn.innerHTML=head("Blockchain explorer","Search transactions, addresses and blocks.")+netStats()+`<div class="card"><div class="bar"><input id="eq" placeholder="Transaction ID, hash, wallet address or block number" aria-label="Explorer search"><button class="btn" id="eb" style="flex:0 0 auto">Search</button></div><div id="eo"></div></div>`;
 const go=()=>{const v=$("#eq").value.trim();if(!v){$("#eo").innerHTML="";return}const t=services.explorer(v);$("#eo").innerHTML=t?rows(t):'<div class="empty">No record found. Check the ID, address or block number.</div>'};
 $("#eb").onclick=go;$("#eq").onkeydown=e=>e.key==="Enter"&&go()},

account(mn){
 mn.innerHTML=head("Account","Profile, security and preferences.")+`<div class="g2"><div class="card"><h2>Account information</h2>
 ${[["Name",esc(PROFILE.name)],["Email",esc(PROFILE.email)]].map(([a,b])=>`<div class="row"><span class="k">${a}</span><span>${b}</span></div>`).join("")}</div>
 <div class="card"><h2>Security</h2><label for="np">New password</label><input id="np" type="password"><div class="err" id="ne"></div>
 <button class="btn" id="cp">Change password</button><label style="display:flex;gap:8px;align-items:center;margin-top:16px"><input type="checkbox" id="tf" style="width:auto"> Two-factor authentication (prototype)</label>
 <h2 style="margin-top:16px">Sessions</h2><div class="row"><span>This device</span><span class="k">Active</span></div><button class="btn g" id="rs" style="margin-top:10px">Revoke other sessions</button></div></div>`;
 $("#cp").onclick=()=>{const v=$("#np").value;$("#ne").textContent=v.length<8?"Use at least 8 characters.":"";if(v.length>=8){toast("Prototype only: password not changed");$("#np").value=""}};
 $("#tf").onchange=e=>toast("2FA "+(e.target.checked?"enabled":"disabled")+" (prototype only)");
 $("#rs").onclick=()=>confirmBox("Revoke other sessions?",()=>toast("Sessions revoked"))},

settings(mn){
 mn.innerHTML=head("Settings","Preferences apply to this browser only.")+`<div class="card" style="max-width:520px"><label for="th2">Theme</label><select id="th2"><option value="light">Light</option><option value="dark">Dark</option></select>
 ${["Email alerts","Weekly summary","Security notices"].map(n=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" style="width:auto" checked data-n="${n}"> ${n}</label>`).join("")}</div>`;
 $("#th2").value=cur();$("#th2").onchange=e=>{store.set("bv-theme",e.target.value);applyTheme(e.target.value)};
 mn.querySelectorAll("[data-n]").forEach(c=>c.onchange=()=>toast(c.dataset.n+" preference saved (prototype)"))},

admin(mn){
 mn.innerHTML=head("Admin","User administration.")+`<div class="grid">
 <div class="card"><div class="k">Users</div><div class="v">${USERS.length}</div></div>
 <div class="card"><div class="k">Transactions</div><div class="v">${TXS.length}</div></div>
 <div class="card"><div class="k">Total wallet holdings</div><div class="v">${tok(USERS.reduce((a,u)=>a+u.bal,0))}</div></div>
 <div class="card"><div class="k">Active sessions</div><div class="v">1</div></div></div>
 <div class="card"><h2>Users</h2><div class="tw"><table><thead><tr>${["User ID","Name","Email","Status","Created","Wallet balance","Action"].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
 ${services.users().map(u=>`<tr><td class="mono">${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="badge">${u.status}</span></td><td>${u.created}</td><td>${tok(u.bal)}</td><td><button class="btn g" data-u="${esc(u.name)}">Toggle</button></td></tr>`).join("")}</tbody></table>${USERS.length?"":'<div class="empty">No users yet.</div>'}</div></div>`;
 mn.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>confirmBox("Toggle status for "+b.dataset.u+"? (mock action)",()=>toast("Mock status change recorded")))}
};
R.prices=mn=>{mn.innerHTML=head("Prices","Prices for the assets in this wallet.")+`<div class="card" style="padding:0">${HOLD.length?HOLD.map((a,i)=>`<div class="hr"><div class="ic" style="background:${a.col}">${a.s[0]}</div><div style="flex:1"><b>${a.n}</b><div class="k">${a.s}</div></div>${spark(i,a.col,a.c>=0)}<div style="text-align:right;min-width:90px"><b>${usd(a.p)}</b><div>${chg(a)}</div></div></div>`).join(""):'<div class="empty">No assets yet.</div>'}</div>`};
R.assets=mn=>{mn.innerHTML=head("Assets","Wallet addresses and balances.")+`<div class="card" style="padding:0">${HOLD.length?HOLD.map((a,i)=>`<div class="hr"><div class="ic" style="background:${a.col}">${a.s[0]}</div><div style="flex:1;min-width:0"><b>${a.n}</b><div class="k">${a.q}</div><div class="mono k" style="word-break:break-all">bc1${hex(i+50,30)}</div></div><b>${usd(a.v)}</b></div>`).join(""):'<div class="empty">No assets yet.</div>'}</div>`};
R.activity=mn=>{mn.innerHTML=head("Activity","On-chain network activity.")+netStats()+latest();mn.querySelectorAll("[data-tx]").forEach(r=>r.onclick=()=>detail(TXS.find(t=>t.id===r.dataset.tx)))};
function rows(t){return [["Transaction hash",t.hash],["Block",t.block],["Timestamp",t.date+" 12:00 UTC"],["Network",t.network],["Sender",t.from],["Receiver",t.to],["Amount",amt(t)],["Status",t.status],["Gas fee",t.gas],["Confirmations",t.conf]].map(([a,b])=>`<div class="row"><span class="k">${a}</span><span class="mono" style="text-align:right">${esc(b)}</span></div>`).join("")}
function detail(t){modal("<h2>"+esc(t.id)+"</h2>"+rows(t))}

addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal").forEach(m=>m.remove())});

/* ---------- send / receive / export ---------- */
function recvBox(){const m=modal(`<h2>Receive</h2><label for="ra">Asset</label><select id="ra">${HOLD.map((a,i)=>`<option value="${i}">${a.n}</option>`).join("")}</select><label>Your address</label><div class="mono" id="ad" style="word-break:break-all;padding:10px;background:var(--bg);border-radius:8px"></div><button class="btn" id="cb" style="margin-top:12px;width:100%">Copy address</button>`);
 const q=x=>m.querySelector(x),sh=()=>q("#ad").textContent="bc1"+hex(+q("#ra").value+50,30);sh();q("#ra").onchange=sh;
 q("#cb").onclick=()=>navigator.clipboard.writeText(q("#ad").textContent).then(()=>toast("Address copied"),()=>toast("Copy failed. Select the address and copy it manually."))}
function sendBox(){const m=modal(`<h2>Send</h2><label for="sa">Asset</label><select id="sa">${HOLD.map((a,i)=>`<option value="${i}">${a.n} (${usd(a.v)})</option>`).join("")}</select><label for="st">Recipient address</label><input id="st" placeholder="bc1…" autocomplete="off"><label for="sm">Amount (USD)</label><input id="sm" type="number" min="0" step="0.01" inputmode="decimal"><div class="verify" id="sv"><div class="verify-head"><div class="verify-title"><span class="verify-mark">✓</span><span>Transfer verification</span></div><span class="verify-badge">PROTECTED</span><button type="button" class="verify-refresh" id="svr">↻</button></div><label for="svc" id="svq">Solve the security check</label><input id="svc" type="number" inputmode="numeric" placeholder="Enter answer"><div class="k">Confirm you are present before reviewing this transfer.</div></div><div class="err" id="se" role="alert"></div><button class="btn" id="sg" style="width:100%">Review and send</button>`);
 const q=x=>m.querySelector(x);let sa=0;const ns=()=>{const a=2+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*8);sa=a+b;q("#svq").textContent=`Solve: ${a} + ${b} =`;q("#svc").value=""};q("#svr").onclick=()=>rv(q("#sv"),q("#svr"),ns);ns();
 q("#sg").onclick=()=>{const a=HOLD[+q("#sa").value],to=q("#st").value.trim(),n=+q("#sm").value;
  const e=!to?"Enter a recipient crypto address.":!(n>0)?"Enter an amount greater than zero.":n>a.v?"Amount is more than your "+a.n+" balance.":Number(q("#svc").value)!==sa?"Please complete the transfer verification.":"";
  q("#se").textContent=e;if(e){if(Number(q("#svc").value)!==sa)ns();return}m.remove();
  confirmBox("Send "+usd(n)+" of "+a.n+"?",()=>{const id=+TXS[0].id.slice(3)+1;a.v-=n;a.q=(a.v/a.p).toFixed(8)+" "+a.s;
   TXS.unshift({id:"TX-"+id,date:new Date().toISOString().slice(0,10),type:"Transfer",asset:a.s,amount:-n,status:"Pending",network:NW[0],ref:"REF-"+hex(id,6).toUpperCase(),hash:"0x"+hex(id,56),block:LATEST+1,from:"bc1"+hex(50,30),to,gas:"0.00042 GAS",conf:0});
   toast("Sent. Transaction is pending.");route()})}}
function exportCsv(){const c=["id","date","type","asset","amount","status","network","ref"],csv=[c.join(","),...TXS.map(t=>c.map(k=>'"'+String(t[k]).replace(/"/g,'""')+'"').join(","))].join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="transactions.csv";a.click();URL.revokeObjectURL(a.href);toast("Exported "+TXS.length+" transactions")}

boot();
</script>
</body>
</html>
